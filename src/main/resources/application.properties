spring.application.name=GestionTurnos

# =====================================================================
# Base de datos (MySQL)
# En local se usan los valores por defecto de abajo.
# En Fly.io (o cualquier otro hosting) se sobreescriben con variables
# de entorno. Ver fly.toml y DEPLOY.md.
# =====================================================================
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:test9}?useSSL=${DB_SSL:false}&allowPublicKeyRetrieval=true&serverTimezone=${DB_TIMEZONE:America/Argentina/Buenos_Aires}&characterEncoding=UTF-8&useUnicode=true
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

# Pool de conexiones (HikariCP)
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT:3000}
spring.datasource.hikari.max-lifetime=${DB_MAX_LIFETIME:1800000}
spring.datasource.hikari.validation-timeout=2000

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=${JPA_DIALECT:org.hibernate.dialect.MySQLDialect}
spring.jpa.properties.hibernate.format_sql=false

# =====================================================================
# Servidor
# =====================================================================
server.port=${PORT:8091}
server.address=0.0.0.0
server.servlet.context-path=${CONTEXT_PATH:/gestionturnos}
# Detrás del proxy de Fly.io: respeta X-Forwarded-Proto / X-Forwarded-Host
server.forward-headers-strategy=framework
server.compression.enabled=true
server.compression.mime-types=text/html,text/css,text/javascript,application/javascript,application/json,image/svg+xml
server.shutdown=graceful

# Sesiones (la app usa sesiones en memoria: mantener una sola máquina en Fly.io)
server.servlet.session.timeout=${SESSION_TIMEOUT:60m}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}

# Errores (no exponer stacktraces en producción)
server.error.whitelabel.enabled=true
server.error.include-message=${ERROR_INCLUDE_MESSAGE:never}
server.error.include-exception=${ERROR_INCLUDE_EXCEPTION:false}
server.error.include-stacktrace=${ERROR_INCLUDE_STACKTRACE:never}

# =====================================================================
# Actuator (healthcheck de Fly.io)
# =====================================================================
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true

# =====================================================================
# Recursos estáticos / Thymeleaf
# =====================================================================
spring.web.resources.static-locations=classpath:/META-INF/resources/,classpath:/resources/,classpath:/static/
spring.thymeleaf.cache=${THYMELEAF_CACHE:true}

# =====================================================================
# Datos iniciales (roles + usuario administrador)
# Solo se crean si la base está vacía. La contraseña se define con el
# secret ADMIN_PASSWORD. Si no se define, se genera una aleatoria y se
# muestra en el log del arranque.
# =====================================================================
app.bootstrap.enabled=${APP_BOOTSTRAP_ENABLED:true}
app.bootstrap.admin-username=${ADMIN_USERNAME:admin}
app.bootstrap.admin-password=${ADMIN_PASSWORD:}
app.bootstrap.admin-role=${ADMIN_ROLE:Administrador}
