name: Deploy a Fly.io

on:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: fly-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build y deploy de la app
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy
        # --remote-only compila en los builders de Fly.io (no requiere Docker en el runner)
        # --ha=false mantiene una sola máquina (sesiones en memoria)
        run: flyctl deploy --remote-only --ha=false
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
